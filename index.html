<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Карточный Аналитик — Ozon / WB</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Geologica:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0e11;
    --surface: #14161b;
    --surface2: #1c1f27;
    --border: #2a2e3a;
    --accent: #e8ff47;
    --accent2: #ff6b35;
    --text: #e8eaf0;
    --muted: #6b7280;
    --radius: 12px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Geologica', sans-serif;
    font-weight: 300;
    min-height: 100vh;
  }

  header {
    padding: 32px 48px 0;
    display: flex;
    align-items: flex-end;
    gap: 16px;
    animation: fadeDown 0.6s ease both;
  }

  .logo-text {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(36px, 5vw, 56px);
    letter-spacing: 2px;
    line-height: 1;
  }

  .logo-badge {
    background: var(--accent);
    color: #000;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1px;
    padding: 3px 8px;
    border-radius: 4px;
    margin-bottom: 6px;
  }

  .tagline {
    padding: 6px 48px 32px;
    font-size: 13px;
    color: var(--muted);
    animation: fadeDown 0.6s 0.1s ease both;
  }

  .container {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 2px;
    padding: 0 2px;
    min-height: calc(100vh - 120px);
    animation: fadeUp 0.7s 0.2s ease both;
  }

  @media (max-width: 900px) {
    .container { grid-template-columns: 1fr; }
    header, .tagline { padding-left: 20px; padding-right: 20px; }
  }

  .panel {
    background: var(--surface);
    padding: 32px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  .panel-left { border-right: 1px solid var(--border); }

  .panel-label {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: -8px;
  }

  .field { display: flex; flex-direction: column; gap: 8px; }

  .field label {
    font-size: 12px;
    font-weight: 500;
    color: var(--muted);
    letter-spacing: 0.5px;
  }

  input, textarea {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text);
    font-family: 'Geologica', sans-serif;
    font-size: 14px;
    font-weight: 300;
    padding: 12px 16px;
    transition: border-color 0.2s, box-shadow 0.2s;
    resize: none;
    width: 100%;
    outline: none;
  }

  input:focus, textarea:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(232,255,71,0.08);
  }

  input::placeholder, textarea::placeholder { color: #3d4150; }

  textarea.short { height: 90px; }
  textarea.tall  { height: 130px; }

  .tabs { display: flex; gap: 6px; }

  .tab {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--muted);
    cursor: pointer;
    font-family: 'Geologica', sans-serif;
    font-size: 13px;
    font-weight: 500;
    padding: 7px 18px;
    transition: all 0.2s;
  }

  .tab.active { background: var(--accent); border-color: var(--accent); color: #000; }

  .btn-analyze {
    background: var(--accent);
    border: none;
    border-radius: var(--radius);
    color: #000;
    cursor: pointer;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 22px;
    letter-spacing: 2px;
    padding: 16px 32px;
    transition: transform 0.15s, box-shadow 0.15s;
    width: 100%;
    margin-top: 4px;
  }

  .btn-analyze:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 32px rgba(232,255,71,0.25);
  }

  .btn-analyze:active { transform: translateY(0); }

  .btn-analyze:disabled {
    background: var(--surface2);
    color: var(--muted);
    cursor: not-allowed;
    transform: none;
    box-shadow: none;
  }

  .panel-right { position: relative; min-height: 500px; }

  .empty-state {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    min-height: 400px;
    gap: 16px;
    color: var(--muted);
    text-align: center;
  }

  .empty-icon { font-size: 52px; opacity: 0.3; }

  .empty-state p { font-size: 14px; max-width: 220px; line-height: 1.6; }

  .result-wrap {
    display: none;
    flex-direction: column;
    gap: 16px;
    height: 100%;
  }

  .result-wrap.visible { display: flex; }

  .result-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px;
  }

  .result-meta { font-size: 12px; color: var(--muted); }
  .result-meta span { color: var(--accent); font-weight: 500; }

  .result-actions { display: flex; gap: 8px; }

  .btn-copy, .btn-download {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--muted);
    cursor: pointer;
    font-family: 'Geologica', sans-serif;
    font-size: 12px;
    font-weight: 500;
    padding: 7px 14px;
    transition: all 0.2s;
  }

  .btn-copy:hover, .btn-download:hover {
    color: var(--text);
    border-color: var(--accent);
  }

  .sections {
    display: flex;
    flex-direction: column;
    gap: 12px;
    overflow-y: auto;
    flex: 1;
    padding-right: 4px;
  }

  .sections::-webkit-scrollbar { width: 4px; }
  .sections::-webkit-scrollbar-track { background: transparent; }
  .sections::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  .section {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    animation: fadeUp 0.4s ease both;
  }

  .section-head {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 16px;
    cursor: pointer;
    user-select: none;
    transition: background 0.2s;
  }

  .section-head:hover { background: rgba(255,255,255,0.03); }

  .section-icon { font-size: 16px; }

  .section-title { font-size: 13px; font-weight: 500; flex: 1; }

  .section-chevron { color: var(--muted); font-size: 12px; transition: transform 0.2s; }

  .section.open .section-chevron { transform: rotate(180deg); }

  .section-body {
    border-top: 1px solid var(--border);
    padding: 16px;
    font-size: 13.5px;
    line-height: 1.75;
    color: #c4c8d4;
    display: none;
    white-space: pre-wrap;
  }

  .section.open .section-body { display: block; }

  .score-badge {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 13px;
    letter-spacing: 1px;
    padding: 2px 8px;
    border-radius: 6px;
  }

  .score-high { background: rgba(232,255,71,0.15); color: var(--accent); }
  .score-med  { background: rgba(255,107,53,0.15); color: var(--accent2); }
  .score-low  { background: rgba(239,68,68,0.15);  color: #f87171; }

  .loading-overlay {
    display: none;
    position: absolute; inset: 0;
    background: var(--surface);
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
    z-index: 10;
  }

  .loading-overlay.visible { display: flex; }

  .loading-bars { display: flex; gap: 5px; align-items: flex-end; height: 40px; }

  .bar {
    width: 6px;
    background: var(--accent);
    border-radius: 3px;
    animation: barBounce 1s ease-in-out infinite;
  }

  .bar:nth-child(2) { animation-delay: 0.15s; background: var(--accent2); }
  .bar:nth-child(3) { animation-delay: 0.3s; }
  .bar:nth-child(4) { animation-delay: 0.45s; background: var(--accent2); }
  .bar:nth-child(5) { animation-delay: 0.6s; }

  .loading-text { font-size: 13px; color: var(--muted); letter-spacing: 0.5px; }
  .loading-step { font-size: 12px; color: var(--accent); font-weight: 500; height: 18px; }

  .error-box {
    background: rgba(239,68,68,0.08);
    border: 1px solid rgba(239,68,68,0.3);
    border-radius: var(--radius);
    color: #f87171;
    font-size: 13px;
    line-height: 1.6;
    padding: 14px 16px;
    display: none;
  }

  .error-box.visible { display: block; }

  @keyframes fadeDown { from { opacity:0; transform:translateY(-16px); } to { opacity:1; transform:none; } }
  @keyframes fadeUp   { from { opacity:0; transform:translateY(16px);  } to { opacity:1; transform:none; } }
  @keyframes barBounce { 0%, 100% { height: 10px; } 50% { height: 36px; } }
</style>
</head>
<body>

<header>
  <div class="logo-text">Карточный&nbsp;Аналитик</div>
  <div class="logo-badge">AI</div>
</header>
<div class="tagline">Анализ карточек Ozon и Wildberries · SEO · CTR · Отзывы</div>

<div class="container">

  <div class="panel panel-left">
    <div class="panel-label">Входные данные</div>

    <div class="field">
      <label>Платформа</label>
      <div class="tabs">
        <button class="tab active" onclick="setTab(this,'Ozon')">Ozon</button>
        <button class="tab" onclick="setTab(this,'Wildberries')">Wildberries</button>
        <button class="tab" onclick="setTab(this,'Маркетплейс')">Другое</button>
      </div>
      <input type="hidden" id="platform" value="Ozon">
    </div>

    <div class="field">
      <label>Заголовок товара *</label>
      <input type="text" id="title" placeholder="Кроссовки мужские летние дышащие…">
    </div>

    <div class="field">
      <label>Описание товара *</label>
      <textarea id="description" class="short" placeholder="Текущее описание из карточки…"></textarea>
    </div>

    <div class="field">
      <label>Отзывы покупателей (каждый с новой строки)</label>
      <textarea id="reviews" class="tall" placeholder="Отличный товар, пришёл быстро&#10;Не соответствует размеру, вернул&#10;Качество хуже чем на фото…"></textarea>
    </div>

    <div class="field">
      <label>Конкуренты — заголовки через запятую (опционально)</label>
      <textarea id="competitors" class="short" placeholder="Nike Air Max 270, Adidas Ultraboost 22…"></textarea>
    </div>

    <div id="errorBox" class="error-box"></div>

    <button class="btn-analyze" id="analyzeBtn" onclick="runAnalysis()">
      Анализировать
    </button>
  </div>

  <div class="panel panel-right" id="rightPanel">

    <div class="empty-state" id="emptyState">
      <div class="empty-icon">🔍</div>
      <p>Заполни данные слева и нажми «Анализировать»</p>
    </div>

    <div class="loading-overlay" id="loadingOverlay">
      <div class="loading-bars">
        <div class="bar"></div><div class="bar"></div><div class="bar"></div>
        <div class="bar"></div><div class="bar"></div>
      </div>
      <div class="loading-text">Claude анализирует карточку…</div>
      <div class="loading-step" id="loadingStep">Читаю описание</div>
    </div>

    <div class="result-wrap" id="resultWrap">
      <div class="result-header">
        <div class="result-meta">Анализ готов · <span id="resultPlatform"></span></div>
        <div class="result-actions">
          <button class="btn-copy" onclick="copyResult()">📋 Копировать</button>
          <button class="btn-download" onclick="downloadResult()">⬇ .md</button>
        </div>
      </div>
      <div class="sections" id="sections"></div>
    </div>

  </div>
</div>

<script>
let currentPlatform = 'Ozon';
let lastRawResult = '';

function setTab(el, val) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  currentPlatform = val;
}

const STEPS = [
  'Читаю заголовок и описание…',
  'Сравниваю с конкурентами…',
  'Ищу SEO-пробелы…',
  'Анализирую отзывы…',
  'Генерирую гипотезы CTR…',
  'Формирую рекомендации…',
];

let stepIndex = 0, stepTimer = null;

function startSteps() {
  stepIndex = 0;
  document.getElementById('loadingStep').textContent = STEPS[0];
  stepTimer = setInterval(() => {
    stepIndex = (stepIndex + 1) % STEPS.length;
    document.getElementById('loadingStep').textContent = STEPS[stepIndex];
  }, 2200);
}

function stopSteps() { clearInterval(stepTimer); }

async function runAnalysis() {
  const title = document.getElementById('title').value.trim();
  const description = document.getElementById('description').value.trim();
  const reviews = document.getElementById('reviews').value.trim();
  const competitors = document.getElementById('competitors').value.trim();

  const errBox = document.getElementById('errorBox');
  errBox.classList.remove('visible');

  if (!title) return showError('Укажи заголовок товара — это обязательное поле');
  if (!description) return showError('Добавь описание товара');

  document.getElementById('emptyState').style.display = 'none';
  document.getElementById('resultWrap').classList.remove('visible');
  document.getElementById('loadingOverlay').classList.add('visible');
  document.getElementById('analyzeBtn').disabled = true;
  startSteps();

  try {
    const response = await fetch('/api/analyze', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ platform: currentPlatform, title, description, reviews, competitors }),
    });

    const data = await response.json();

    if (!response.ok) throw new Error(data.error || 'Ошибка сервера');

    lastRawResult = data.result;
    renderResult(data.result);

  } catch (e) {
    showError(e.message);
  } finally {
    stopSteps();
    document.getElementById('loadingOverlay').classList.remove('visible');
    document.getElementById('analyzeBtn').disabled = false;
  }
}

const SECTION_META = {
  'SEO_SCORE':           { icon: '📊', title: 'SEO-оценка',         open: true  },
  'SEO_АНАЛИЗ':          { icon: '🔎', title: 'SEO-анализ',          open: true  },
  'НОВЫЕ_ЗАГОЛОВКИ':     { icon: '✏️', title: 'Новые заголовки',     open: true  },
  'УЛУЧШЕННОЕ_ОПИСАНИЕ': { icon: '📝', title: 'Улучшенное описание', open: false },
  'CTR_ГИПОТЕЗЫ':        { icon: '⚡', title: 'Гипотезы для CTR',    open: false },
  'ИНФОГРАФИКА':         { icon: '🖼', title: 'Идеи инфографики',    open: false },
  'АНАЛИЗ_ОТЗЫВОВ':      { icon: '💬', title: 'Анализ отзывов',      open: false },
};

function renderResult(text) {
  const container = document.getElementById('sections');
  container.innerHTML = '';

  const parts = text.split(/^##\s*/m).filter(Boolean);
  const parsed = {};
  parts.forEach(part => {
    const nl = part.indexOf('\n');
    const key = nl > -1 ? part.slice(0, nl).trim() : part.trim();
    const body = nl > -1 ? part.slice(nl + 1).trim() : '';
    parsed[key] = body;
  });

  Object.entries(SECTION_META).forEach(([key, meta], i) => {
    const body = parsed[key] || '';
    if (!body) return;

    const section = document.createElement('div');
    section.className = 'section' + (meta.open ? ' open' : '');
    section.style.animationDelay = (i * 0.06) + 's';

    if (key === 'SEO_SCORE') {
      const score = parseInt(body) || 0;
      const cls = score >= 70 ? 'score-high' : score >= 40 ? 'score-med' : 'score-low';
      const lbl = score >= 70 ? 'Хорошо' : score >= 40 ? 'Средне' : 'Слабо';
      section.innerHTML = `
        <div class="section-head" onclick="toggleSection(this)">
          <span class="section-icon">${meta.icon}</span>
          <span class="section-title">${meta.title}</span>
          <span class="score-badge ${cls}">${score} / 100 · ${lbl}</span>
          <span class="section-chevron">▼</span>
        </div>
        <div class="section-body">Текущая оценка SEO: ${score} из 100.\n${score < 70 ? 'Есть потенциал — смотри раздел SEO-анализа.' : 'Неплохая база, но детали важны.'}</div>`;
    } else {
      section.innerHTML = `
        <div class="section-head" onclick="toggleSection(this)">
          <span class="section-icon">${meta.icon}</span>
          <span class="section-title">${meta.title}</span>
          <span class="section-chevron">▼</span>
        </div>
        <div class="section-body">${escapeHtml(body)}</div>`;
    }
    container.appendChild(section);
  });

  document.getElementById('resultPlatform').textContent = currentPlatform;
  document.getElementById('resultWrap').classList.add('visible');
}

function toggleSection(head) { head.closest('.section').classList.toggle('open'); }

function escapeHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function copyResult() {
  navigator.clipboard.writeText(lastRawResult).then(() => {
    const btn = document.querySelector('.btn-copy');
    btn.textContent = '✅ Скопировано';
    setTimeout(() => btn.textContent = '📋 Копировать', 2000);
  });
}

function downloadResult() {
  const title = document.getElementById('title').value.trim().slice(0, 40) || 'анализ';
  const blob = new Blob([lastRawResult], { type: 'text/markdown' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `анализ_${title}.md`;
  a.click();
}

function showError(msg) {
  const b = document.getElementById('errorBox');
  b.textContent = '⚠ ' + msg;
  b.classList.add('visible');
  document.getElementById('loadingOverlay').classList.remove('visible');
  document.getElementById('analyzeBtn').disabled = false;
}
</script>
</body>
</html>
